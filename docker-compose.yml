services:
  web:
    restart: always
    image: miahilus/online_course_project:latest
    container_name: final_task
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py add_database && python manage.py createadmin && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/static
    expose:
      - "8000"
    depends_on:
          db:
            condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    container_name: psgr
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5


  redis:
    image: redis
    ports:
      - "6379:6379"
    depends_on:
      - web

  celery:
    build: .
    command: bash -c "celery -A config worker -l INFO"
    env_file:
      - .env
    depends_on:
      - redis

  celery_beat:
    build: .
    command: bash -c "celery -A config beat -l INFO -S django"
    env_file:
      - .env
    depends_on:
      - celery

  nginx:
    build:
      context: ./nginx
    image: nginx_final_task
    container_name: final_task_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  redis_data: